<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Sepolia Faucet 🐾 | Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- 블록체인 네온 다크 테마 --- */
        :root {
            --bg-deep: #0a0e27;
            --bg-surface: #111633;
            --bg-elevated: #1a1f4a;
            --neon-cyan: #00d4ff;
            --neon-purple: #7c3aed;
            --neon-green: #10b981;
            --neon-orange: #f59e0b;
            --neon-red: #ef4444;
            --border-muted: #2a2f5a;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --font-ui: 'Segoe UI', 'Malgun Gothic', sans-serif;
            --font-code: 'Consolas', 'Fira Code', monospace;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: var(--bg-surface);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border-muted);
            width: 600px;
            max-width: 90vw;
        }

        .nyan-cat {
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1.1;
            white-space: pre;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .color-1 {
            color: #ef4444;
        }

        .color-2 {
            color: #f59e0b;
        }

        .color-3 {
            color: #10b981;
        }

        .color-4 {
            color: #00d4ff;
        }

        .color-5 {
            color: #7c3aed;
        }

        h1 {
            color: var(--text-main);
            margin-top: 0;
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
            background: var(--bg-deep);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-muted);
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .info-value {
            color: var(--text-main);
            font-size: 1rem;
            font-family: var(--font-code);
        }

        .info-value.highlight {
            color: var(--neon-cyan);
        }

        .info-value.reward {
            color: var(--neon-orange);
            font-size: 1.3rem;
            font-weight: bold;
        }

        .info-value.status {
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
        }

        .target-address-box {
            background: #000;
            border: 1px solid var(--border-muted);
            padding: 12px;
            border-radius: 6px;
            font-family: var(--font-code);
            font-size: 0.9rem;
            color: var(--neon-purple);
            text-align: center;
            margin-bottom: 25px;
            word-break: break-all;
        }

        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        button {
            background-color: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover:not(:disabled) {
            background-color: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        button:disabled {
            border-color: var(--border-muted);
            color: var(--text-muted);
            cursor: not-allowed;
            background-color: rgba(255, 255, 255, 0.05);
        }

        #requestBtn {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--neon-orange);
            color: var(--neon-orange);
            font-size: 1.1rem;
            padding: 18px 30px;
        }

        #status {
            color: var(--neon-green);
            height: 20px;
            font-size: 0.9rem;
            text-align: center;
        }

        .chart-container {
            width: 100%;
            margin-top: 25px;
            background: var(--bg-elevated);
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid var(--border-muted);
            min-height: 180px;
        }

        a {
            color: var(--neon-cyan);
            text-decoration: none;
            border-bottom: 1px dashed;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nyan-cat">
            <span class="color-1">≈=≈=≈=≈=≈=</span><span class="color-2">≈=≈=≈=≈=≈=</span> /\_/\
            <span class="color-3">≈=≈=≈=≈=≈=</span><span class="color-4">≈=≈=≈=≈=≈=</span> ( o.o )
            <span class="color-5">≈=≈=≈=≈=≈=</span><span class="color-1">≈=≈=≈=≈=≈=</span> > ^ < </div>

                <h1>Sepolia Faucet Network</h1>

                <div style="text-align: left; margin-bottom: 5px; color: var(--text-muted); font-size: 0.85rem;">Target
                    Address:</div>
                <div class="target-address-box" id="accountArea">
                    Wallet Not Connected.
                </div>

                <button id="connectBtn">🔗 지갑 연결하기</button>

                <hr style="border: 0; height: 1px; background-color: var(--border-muted); margin: 25px 0;">

                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Your Claimed Reward:</span>
                        <span class="info-value reward"><span id="faucetBalance">0.000</span> SepETH</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Network Status:</span>
                        <span class="info-value status">
                            <div class="status-dot"></div> Sepolia Online
                        </span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Minimum Claim Reward:</span>
                        <span class="info-value highlight">0.01 SepETH</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Daily Claim Limit:</span>
                        <span class="info-value">0.50 SepETH</span>
                    </div>
                </div>

                <div class="action-area">
                    <button id="requestBtn" disabled>Receive 0.01 SepETH</button>
                    <div id="status"></div>
                </div>

                <div class="chart-container">
                    <canvas id="balanceChart"></canvas>
                </div>
        </div>

        <script src="abi.js"></script>
        <script src="app.js"></script>
</body>

</html>

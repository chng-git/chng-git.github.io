<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026-1 블록체인 실습 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 요청하신 보라색(#a7a2ea)을 기준으로 색상 체계 구성 */
            --accent-purple: #a7a2ea;
            --accent-light: #c2bef5;
            --bg-gradient-top: #121212;
            --bg-gradient-bottom: #1a1a2e;
            /* 하단에 아주 살짝 푸른빛이 도는 어두운 색 */
            --container-bg: rgba(30, 30, 30, 0.8);
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: rgba(255, 255, 255, 0.1);
            --hover-bg: rgba(167, 162, 234, 0.1);
        }

        body {
            /* 배경 그라데이션 적용 */
            background: linear-gradient(180deg, var(--bg-gradient-top) 0%, var(--bg-gradient-bottom) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 50px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
        }

        /* 헤더 섹션 */
        .header {
            background-color: var(--container-bg);
            backdrop-filter: blur(10px);
            /* 유리 질감 효과 */
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--accent-purple);
            padding: 35px;
            border-radius: 12px;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .header h1 {
            margin: 0 0 12px 0;
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-purple);
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 6px 0;
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.5;
        }

        /* 우측 상단 장식 실루엣 */
        .header::after {
            content: "🐈";
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 45px;
            opacity: 0.1;
            filter: brightness(1.5);
        }

        h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--text-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-purple);
        }

        /* 테이블 스타일 */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--container-bg);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        th {
            background-color: rgba(40, 40, 40, 0.5);
            color: var(--accent-purple);
            text-align: left;
            padding: 18px 25px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 18px 25px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-secondary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: var(--hover-bg);
            transition: background 0.3s ease;
        }

        .week-tag {
            color: var(--accent-purple);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* 링크 스타일 */
        a {
            color: var(--accent-light);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
            transition: all 0.2s;
        }

        a:hover {
            color: var(--accent-purple);
            border-bottom-color: var(--accent-purple);
        }

        .no-ui {
            font-size: 12px;
            color: #777;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #status-msg {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <header class="header">
            <h1>2026-1 Blockchain Lab Archive</h1>
            <p>블록체인 실습 수업의 주차별 결과물과 소스 코드를 기록하는 대시보드입니다.</p>
            <p>포인트 색상은 보라색(#a7a2ea) 계열로 구성되었으며, 실시간 동기화를 지원합니다.</p>
        </header>

        <h2>Assignment List</h2>
        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">주차</th>
                    <th style="width: 45%;">과제명</th>
                    <th style="width: 20%;">Source</th>
                    <th style="width: 20%;">Demo</th>
                </tr>
            </thead>
            <tbody id="content-table">
                <tr>
                    <td colspan="4" id="status-msg">과제 목록을 동기화 중입니다...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const CONFIG = {
            owner: 'chng-git',
            repo: 'chng-git.github.io'
        };

        async function initDashboard() {
            const tableBody = document.getElementById('content-table');

            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/`);
                const items = await res.json();

                // 'week' 키워드로 시작하는 폴더 필터링 및 정렬
                const assignments = items
                    .filter(item => item.type === 'dir' && item.name.toLowerCase().startsWith('week'))
                    .sort((a, b) => {
                        const numA = parseInt(a.name.match(/\d+/) || 0);
                        const numB = parseInt(b.name.match(/\d+/) || 0);
                        return numB - numA;
                    });

                if (assignments.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" id="status-msg">등록된 과제가 없습니다.</td></tr>';
                    return;
                }

                tableBody.innerHTML = '';

                assignments.forEach(item => {
                    const name = item.name;
                    const weekNum = name.match(/week(\d+)/i)?.[1] || '?';

                    let title = name.includes('_')
                        ? name.split('_').slice(1).join(' ').replace(/-/g, ' ')
                        : 'Assignment ' + weekNum;

                    title = title.charAt(0).toUpperCase() + title.slice(1);

                    // 특정 폴더 이름 기반 No UI 예외 처리
                    const hasNoUI = name.includes('rpc-practice') || name.includes('week2');
                    const demoLink = hasNoUI
                        ? '<span class="no-ui">No UI</span>'
                        : `<a href="/${name}/" target="_blank">Launch App</a>`;

                    const row = `
                        <tr>
                            <td class="week-tag">WEEK ${weekNum}</td>
                            <td>${title}</td>
                            <td><a href="${item.html_url}" target="_blank">Folder</a></td>
                            <td>${demoLink}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = '<tr><td colspan="4" id="status-msg">동기화 실패. API 호출 제한을 확인하세요.</td></tr>';
            }
        }

        initDashboard();
    </script>
</body>

</html>
